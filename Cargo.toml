[package]
name = "agent_memory"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.36.1", features = ["chat-completion"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.30.0"
redis = "1.2"
rig-core = { version = "0.36.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
